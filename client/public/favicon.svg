<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle glow circle -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>
  
  <!-- Shield shape -->
  <path d="M256 80 L400 140 L400 280 C400 360 340 420 256 440 C172 420 112 360 112 280 L112 140 Z" 
        fill="none" stroke="url(#accent)" stroke-width="16" stroke-linejoin="round" filter="url(#shadow)" opacity="0.9"/>
  
  <!-- Stylized "A" letter -->
  <path d="M256 170 L320 340 L300 340 L285 300 L227 300 L212 340 L192 340 Z M256 210 L235 290 L277 290 Z" 
        fill="url(#accent)" filter="url(#shadow)"/>
  
  <!-- Small circuit dots -->
  <circle cx="256" cy="130" r="6" fill="#6366f1"/>
  <circle cx="370" cy="170" r="4" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="142" cy="170" r="4" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="256" cy="400" r="5" fill="#a78bfa" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="256" y1="136" x2="256" y2="160" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="365" y1="172" x2="345" y2="185" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
  <line x1="147" y1="172" x2="167" y2="185" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
</svg>